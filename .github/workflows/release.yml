name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump "version" in package.json, add its CHANGELOG.md section, push, and the release follows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Lint, Validate and HACS Validation workflows run first:
  # a commit whose checks fail is not released.
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  hacs:
    name: HACS Validation
    uses: ./.github/workflows/hacs.yml
    permissions:
      contents: read

  release:
    needs: [lint, validate, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci

      # The layout tests (test/layout.test.mjs) render the mini card in Chromium, as in validate.yml.
      - name: Install Chromium
        if: steps.version.outputs.exists == 'false'
        run: npx playwright install chromium

      - name: Install Chromium system libraries
        if: steps.version.outputs.exists == 'false'
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get update \
              && timeout 300 npx playwright install-deps chromium \
              && ok=1 && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::apt failed 3 times"; exit 1; }

      - name: Check build and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          npm test
          npm run check
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/smartlock-card.js
          body_path: notes.md
          make_latest: true
