name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by Release, so that a version is published only once these checks pass.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The layout tests (test/layout.test.mjs) render the mini card in Chromium. The browser binary is downloaded
      # apart from its system libraries, whose apt work is time-boxed and retried so that a flaky mirror cannot hang.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium system libraries
        timeout-minutes: 12
        run: .github/scripts/install-chromium-deps.sh

      - name: Build and check the card
        run: npm run check

      - name: Unit and layout tests
        run: npm test

      - name: Check hacs.json points to the built file
        run: |
          file=$(node -p "require('./hacs.json').filename")
          test -f "dist/$file" || { echo "dist/$file not built"; exit 1; }
